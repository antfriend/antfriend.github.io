<svg xmlns="http://www.w3.org/2000/svg" width="220" height="240" viewBox="0 0 220 240">
  <!-- RESONATE MARKER  ·  18 mm disc  ·  qty 14  ·  resonates_with -->
  <defs>
    <radialGradient id="resTeal" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#63c9bc"/>
      <stop offset="55%" stop-color="#28968a"/>
      <stop offset="100%" stop-color="#146b62"/>
    </radialGradient>
  </defs>

  <!-- footprint / extrusion outline -->
  <circle cx="110" cy="100" r="92" fill="none" stroke="#0f4f48" stroke-width="2" stroke-dasharray="4 5" opacity="0.5"/>
  <!-- disc body (top face) -->
  <circle cx="110" cy="100" r="84" fill="url(#resTeal)" stroke="#0f4f48" stroke-width="3"/>
  <circle cx="110" cy="100" r="70" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.25"/>

  <!-- engraved tilde groove (recessed in STL) -->
  <path d="M56 100 q 14 -26 28 0 q 14 26 28 0 q 14 -26 28 0"
        fill="none" stroke="#0c3f39" stroke-width="12" stroke-linecap="round"/>
  <path d="M56 100 q 14 -26 28 0 q 14 26 28 0 q 14 -26 28 0"
        fill="none" stroke="#bfe9e2" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>

  <!-- label -->
  <text x="110" y="222" text-anchor="middle" font-family="Georgia, serif"
        font-size="21" letter-spacing="3" fill="#146b62">RESONATE</text>
  <text x="110" y="238" text-anchor="middle" font-family="Georgia, serif"
        font-size="12" letter-spacing="1" fill="#0f4f48">18 mm disc · ×14 · resonates_with</text>
</svg>
